<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<meta name="theme-color" content="#fff6eb">
<title>Lessonly — Creative Learning Studio</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Fredoka:wght@500;600;700&family=Plus+Jakarta+Sans:wght@400;500;600;700;800&display=swap" rel="stylesheet">

<style>
:root{
  --ink:#1b1a38;
  --muted:#67668a;
  --line:#ebe5f8;
  --bg:#fff8f0;
  --white:#ffffff;
  
  /* Fun & Vibrant Palette */
  --purple:#734bf9;
  --purple-dark:#5832d6;
  --pale:#f2ecff;
  --pink:#ff5c93;
  --pink-pale:#ffe8f0;
  --mint:#12b886;
  --mint-pale:#e3faf2;
  --sun:#ffbe0b;
  --sun-pale:#fff8db;
  --sky:#38bdf8;
  --sky-pale:#e0f2fe;
  --coral:#ff6b6b;
  
  --shadow:0 12px 32px rgba(115, 75, 249, 0.08);
  --shadow-hover:0 18px 40px rgba(115, 75, 249, 0.16);
  --radius:20px;
}

*{ box-sizing:border-box }

body{
  margin:0;
  background-color: var(--bg);
  background-image: 
    radial-gradient(circle at 12% 15%, rgba(255, 92, 147, 0.12) 0%, transparent 28%),
    radial-gradient(circle at 88% 20%, rgba(56, 189, 248, 0.14) 0%, transparent 30%),
    radial-gradient(circle at 50% 85%, rgba(255, 190, 11, 0.12) 0%, transparent 35%),
    radial-gradient(#d8cef5 1px, transparent 1px);
  background-size: 100% 100%, 100% 100%, 100% 100%, 24px 24px;
  color: var(--ink);
  font-family:'Plus Jakarta Sans', sans-serif;
  font-size:14px;
  overflow-x: hidden;
}

button, input, textarea, select{
  font:inherit;
}

button{
  cursor:pointer;
}

h1, h2, h3, p{
  margin-top:0;
}

h1, h2, h3, .brand, .title, .stat-value, .score{
  font-family:'Fredoka', sans-serif;
  letter-spacing: -0.01em;
}

/* =========================
   PLAYFUL KEYFRAME ANIMATIONS
========================= */

@keyframes popBounce {
  0% { opacity: 0; transform: scale(0.92) translateY(16px); }
  70% { opacity: 1; transform: scale(1.02) translateY(-3px); }
  100% { opacity: 1; transform: scale(1) translateY(0); }
}

@keyframes floatSlow {
  0%, 100% { transform: translateY(0px) rotate(0deg); }
  50% { transform: translateY(-7px) rotate(2deg); }
}

@keyframes wiggle {
  0%, 100% { transform: rotate(0deg); }
  25% { transform: rotate(-6deg) scale(1.08); }
  75% { transform: rotate(6deg) scale(1.08); }
}

@keyframes gradientShift {
  0% { background-position: 0% 50%; }
  50% { background-position: 100% 50%; }
  100% { background-position: 0% 50%; }
}

@keyframes pulseRing {
  0% { box-shadow: 0 0 0 0 rgba(115, 75, 249, 0.4); }
  70% { box-shadow: 0 0 0 10px rgba(115, 75, 249, 0); }
  100% { box-shadow: 0 0 0 0 rgba(115, 75, 249, 0); }
}

@keyframes confettiDrop {
  0% { transform: translateY(-10vh) rotate(0deg); opacity: 1; }
  100% { transform: translateY(105vh) rotate(720deg); opacity: 0; }
}

.page{
  animation: popBounce .45s cubic-bezier(.34, 1.56, .64, 1);
}

.stats .stat:nth-child(1){ animation: popBounce .45s cubic-bezier(.34, 1.56, .64, 1) .05s both; }
.stats .stat:nth-child(2){ animation: popBounce .45s cubic-bezier(.34, 1.56, .64, 1) .12s both; }
.stats .stat:nth-child(3){ animation: popBounce .45s cubic-bezier(.34, 1.56, .64, 1) .19s both; }

/* =========================
   FUN TACTILE BUTTONS
========================= */

.btn{
  border: 2px solid var(--line);
  background: var(--white);
  color: var(--ink);
  padding: 10px 18px;
  border-radius: 14px;
  font-weight: 700;
  font-size: 13px;
  box-shadow: 0 4px 0 #e2daf5;
  transition: all .2s cubic-bezier(.34, 1.56, .64, 1);
  display: inline-flex;
  align-items: center;
  justify-content: center;
  gap: 6px;
  position: relative;
  overflow: hidden;
}

.btn:hover{
  border-color: var(--purple);
  color: var(--purple);
  transform: translateY(-3px);
  box-shadow: 0 7px 0 #d5c8fa;
}

.btn:active{
  transform: translateY(2px);
  box-shadow: 0 1px 0 #d5c8fa;
}

.btn.primary{
  background: linear-gradient(135deg, var(--purple) 0%, var(--pink) 100%);
  background-size: 200% 200%;
  animation: gradientShift 5s ease infinite;
  border: 2px solid transparent;
  color: #fff;
  box-shadow: 0 5px 0 #4d2cc4, 0 10px 20px rgba(255, 92, 147, 0.25);
}

.btn.primary:hover{
  color: #fff;
  transform: translateY(-3px) scale(1.02);
  box-shadow: 0 8px 0 #4d2cc4, 0 14px 25px rgba(255, 92, 147, 0.35);
}

.btn.primary:active{
  transform: translateY(2px) scale(0.99);
  box-shadow: 0 2px 0 #4d2cc4;
}

.btn.small{
  padding: 7px 12px;
  font-size: 12px;
  border-radius: 11px;
}

.btn.ghost{
  background: rgba(255,255,255,0.6);
  border-color: transparent;
  box-shadow: none;
}

.btn.ghost:hover{
  background: var(--pale);
  transform: translateY(-2px);
  box-shadow: none;
}

/* =========================
   SHELL & SIDEBAR
========================= */

.shell{
  display: flex;
  min-height: 100vh;
}

.sidebar{
  width: 244px;
  background: rgba(255, 255, 255, 0.92);
  backdrop-filter: blur(12px);
  border-right: 2px solid var(--line);
  padding: 26px 16px;
  flex: none;
  display: flex;
  flex-direction: column;
}

.brand{
  font-size: 24px;
  font-weight: 700;
  padding: 2px 12px 28px;
  color: var(--ink);
  display: flex;
  align-items: center;
  gap: 2px;
}

.brand b{
  background: linear-gradient(135deg, var(--purple), var(--pink));
  -webkit-background-clip: text;
  -webkit-text-fill-color: transparent;
}

.brand-sparkle{
  display: inline-block;
  color: var(--sun);
  animation: wiggle 2.5s ease-in-out infinite;
  font-size: 20px;
  margin-left: 4px;
}

.side-label{
  font-size: 11px;
  text-transform: uppercase;
  letter-spacing: 1.2px;
  color: #9692b8;
  font-weight: 800;
  padding: 0 12px 10px;
}

.nav{
  border: 2px solid transparent;
  background: transparent;
  text-align: left;
  color: #5b597d;
  padding: 12px 14px;
  border-radius: 14px;
  margin: 3px 0;
  display: flex;
  align-items: center;
  gap: 12px;
  font-size: 13.5px;
  font-weight: 700;
  transition: all .22s cubic-bezier(.34, 1.56, .64, 1);
}

.nav:hover{
  background: var(--pale);
  color: var(--purple);
  transform: translateX(5px);
}

.nav.active{
  background: linear-gradient(135deg, var(--pale) 0%, var(--pink-pale) 100%);
  color: var(--purple);
  border-color: rgba(115, 75, 249, 0.25);
  box-shadow: 0 4px 12px rgba(115, 75, 249, 0.1);
}

.nav span{
  font-size: 18px;
  width: 24px;
  height: 24px;
  display: grid;
  place-items: center;
  border-radius: 8px;
  background: #fff;
  box-shadow: 0 2px 6px rgba(0,0,0,0.05);
  transition: transform .25s ease;
}

.nav:hover span{
  transform: rotate(-10deg) scale(1.15);
}

.side-bottom{
  margin-top: auto;
  border-top: 2px dashed var(--line);
  padding: 18px 8px 0;
  display: flex;
  gap: 11px;
  align-items: center;
}

.avatar{
  width: 38px;
  height: 38px;
  border-radius: 13px;
  background: linear-gradient(135deg, var(--sun), var(--pink));
  color: #fff;
  display: grid;
  place-items: center;
  font-weight: 800;
  font-family: 'Fredoka', sans-serif;
  box-shadow: 0 4px 10px rgba(255, 92, 147, 0.25);
  transition: transform .2s ease;
}

.avatar:hover{
  transform: rotate(8deg) scale(1.08);
}

.user-name{
  font-weight: 800;
  font-size: 13px;
}

.user-role{
  font-size: 11px;
  color: var(--purple);
  font-weight: 700;
  margin-top: 2px;
}

.main{
  flex: 1;
  min-width: 0;
}

.top{
  height: 68px;
  border-bottom: 2px solid var(--line);
  background: rgba(255, 255, 255, 0.78);
  backdrop-filter: blur(12px);
  display: flex;
  align-items: center;
  justify-content: space-between;
  padding: 0 36px;
  position: sticky;
  top: 0;
  z-index: 15;
}

.crumb{
  color: var(--muted);
  font-size: 13px;
  font-weight: 600;
}

.crumb strong{
  color: var(--purple);
  background: var(--pale);
  padding: 4px 10px;
  border-radius: 99px;
}

.topright{
  display: flex;
  align-items: center;
  gap: 12px;
}

.fake{
  font-size: 11.5px;
  font-weight: 700;
  color: #b86b00;
  background: var(--sun-pale);
  border: 1.5px solid #ffe066;
  padding: 6px 12px;
  border-radius: 99px;
  animation: pulseRing 2.5s infinite;
}

/* =========================
   PAGE & HERO BANNER
========================= */

.page{
  max-width: 1140px;
  margin: auto;
  padding: 34px 36px 70px;
}

.heading{
  display: flex;
  justify-content: space-between;
  align-items: center;
  gap: 20px;
  margin-bottom: 28px;
  background: linear-gradient(135deg, #ffffff 0%, #f6f1ff 60%, #fff0f6 100%);
  border: 2px solid var(--line);
  border-radius: 24px;
  padding: 22px 26px;
  box-shadow: var(--shadow);
  position: relative;
  overflow: hidden;
}

.heading-left{
  display: flex;
  align-items: center;
  gap: 18px;
}

.hero-gif{
  width: 74px;
  height: 74px;
  border-radius: 18px;
  object-fit: cover;
  border: 3px solid #fff;
  box-shadow: 0 8px 20px rgba(115, 75, 249, 0.18);
  animation: floatSlow 4s ease-in-out infinite;
  flex: none;
  background: var(--pale);
}

.eyebrow{
  font-size: 11px;
  color: var(--pink);
  font-weight: 800;
  text-transform: uppercase;
  letter-spacing: 1px;
  margin-bottom: 6px;
  display: inline-block;
  background: var(--pink-pale);
  padding: 3px 10px;
  border-radius: 99px;
}

.heading h1{
  font-size: 28px;
  margin-bottom: 5px;
  color: var(--ink);
}

.heading p{
  color: var(--muted);
  font-size: 13.5px;
  margin: 0;
}

/* =========================
   CARDS & STATS
========================= */

.stats{
  display: grid;
  grid-template-columns: repeat(3, 1fr);
  gap: 16px;
  margin-bottom: 28px;
}

.stat,
.panel,
.activity-card,
.builder-panel,
.preview,
.type-card,
.progress-card{
  background: var(--white);
  border: 2px solid var(--line);
  border-radius: var(--radius);
  box-shadow: var(--shadow);
  transition: transform .25s cubic-bezier(.34, 1.56, .64, 1), box-shadow .25s ease, border-color .25s ease;
}

.stat:hover,
.activity-card:hover,
.progress-card:hover{
  transform: translateY(-5px) scale(1.01);
  box-shadow: var(--shadow-hover);
  border-color: #d2c4fc;
}

.stat{
  padding: 20px;
  display: flex;
  align-items: center;
  gap: 15px;
}

.stat-icon{
  width: 48px;
  height: 48px;
  border-radius: 15px;
  display: grid;
  place-items: center;
  font-size: 22px;
  transition: transform .3s cubic-bezier(.34, 1.56, .64, 1);
}

.stat:nth-child(1) .stat-icon{ background: var(--pale); color: var(--purple); }
.stat:nth-child(2) .stat-icon{ background: var(--pink-pale); color: var(--pink); }
.stat:nth-child(3) .stat-icon{ background: var(--mint-pale); color: var(--mint); }

.stat:hover .stat-icon{
  transform: rotate(-10deg) scale(1.12);
}

.stat-label{
  font-size: 12px;
  font-weight: 700;
  color: var(--muted);
  margin-bottom: 3px;
}

.stat-value{
  font-size: 26px;
  font-weight: 700;
  color: var(--ink);
}

/* =========================
   PANELS & LISTS
========================= */

.panel{
  overflow: hidden;
}

.panel-head{
  padding: 18px 22px;
  display: flex;
  justify-content: space-between;
  align-items: center;
  border-bottom: 2px solid var(--line);
  background: #fcfaff;
}

.panel-head h2{
  font-size: 17px;
  margin: 0;
}

.activity-list{
  padding: 4px 22px;
}

.activity-row{
  display: flex;
  align-items: center;
  gap: 14px;
  padding: 16px 0;
  border-bottom: 1.5px dashed var(--line);
  transition: transform .2s ease;
}

.activity-row:hover{
  transform: translateX(4px);
}

.activity-row:last-child{
  border-bottom: 0;
}

.type-icon{
  width: 42px;
  height: 42px;
  border-radius: 13px;
  background: linear-gradient(135deg, var(--pale), var(--sky-pale));
  color: var(--purple);
  display: grid;
  place-items: center;
  font-size: 19px;
  flex: none;
  font-weight: 700;
}

.activity-meta{
  flex: 1;
  min-width: 0;
}

.activity-name{
  font-weight: 800;
  font-size: 14px;
  white-space: nowrap;
  overflow: hidden;
  text-overflow: ellipsis;
}

.activity-sub{
  font-size: 11.5px;
  color: var(--muted);
  margin-top: 4px;
}

.row-actions{
  display: flex;
  gap: 8px;
}

.badge{
  font-size: 11px;
  padding: 5px 11px;
  border-radius: 99px;
  background: var(--mint-pale);
  color: #0b8761;
  font-weight: 800;
  white-space: nowrap;
}

.badge.pending{
  background: var(--sun-pale);
  color: #b86b00;
}

.badge.red{
  background: #ffe8e8;
  color: var(--coral);
}

.empty{
  text-align: center;
  padding: 40px 20px;
  color: var(--muted);
}

.empty-gif{
  width: 96px;
  height: 96px;
  border-radius: 20px;
  object-fit: cover;
  margin-bottom: 14px;
  box-shadow: 0 10px 24px rgba(115, 75, 249, 0.14);
  animation: floatSlow 3.5s ease-in-out infinite;
}

/* =========================
   PROGRESS BARS
========================= */

.progress-card{
  padding: 18px;
  box-shadow: none;
}

.progress-header{
  display: flex;
  justify-content: space-between;
  align-items: center;
  margin-bottom: 10px;
}

.progress-title{
  font-weight: 800;
  font-size: 14px;
}

.progress-percent{
  font-weight: 800;
  color: var(--pink);
  background: var(--pink-pale);
  padding: 3px 9px;
  border-radius: 99px;
  font-size: 12px;
}

.progress-track,
.tracking-bar{
  height: 11px;
  background: #f0ebfa;
  border-radius: 99px;
  overflow: hidden;
  padding: 2px;
}

.progress-fill,
.tracking-fill{
  height: 100%;
  background: linear-gradient(90deg, var(--purple), var(--pink), var(--sun));
  background-size: 200% 100%;
  border-radius: 99px;
  transition: width .7s cubic-bezier(.34, 1.56, .64, 1);
  animation: gradientShift 4s ease infinite;
}

.progress-meta{
  display: flex;
  justify-content: space-between;
  color: var(--muted);
  font-size: 11px;
  font-weight: 600;
  margin-top: 8px;
}

.grid2{
  display: grid;
  grid-template-columns: 1fr 1fr;
  gap: 20px;
}

/* =========================
   BUILDER
========================= */

.builder-panel{
  padding: 24px;
  margin-bottom: 20px;
}

.builder-panel h2,
.preview h2{
  font-size: 17px;
  margin-bottom: 6px;
}

.hint{
  font-size: 12px;
  color: var(--muted);
  line-height: 1.5;
  margin-bottom: 17px;
}

.label{
  display: block;
  color: var(--ink);
  font-size: 12px;
  font-weight: 800;
  margin: 15px 0 6px;
}

.input,
.textarea,
.select,
.correct-select{
  display: block;
  width: 100%;
  border: 2px solid var(--line);
  border-radius: 13px;
  padding: 11px 13px;
  background: #fff;
  color: var(--ink);
  outline: none;
  font-size: 13px;
  transition: all .2s ease;
}

.input:focus,
.textarea:focus,
.select:focus,
.correct-select:focus{
  border-color: var(--purple);
  box-shadow: 0 0 0 4px rgba(115, 75, 249, 0.14);
  transform: translateY(-1px);
}

.textarea{
  resize: vertical;
  min-height: 90px;
  line-height: 1.55;
}

.types{
  display: grid;
  grid-template-columns: repeat(5, 1fr);
  gap: 11px;
}

.type-card{
  box-shadow: 0 4px 0 var(--line);
  padding: 15px 10px;
  text-align: center;
  cursor: pointer;
}

.type-card:hover{
  transform: translateY(-4px);
  border-color: var(--purple);
  box-shadow: 0 7px 0 #d5c8fa;
}

.type-card.selected{
  border: 2px solid var(--purple);
  background: linear-gradient(180deg, #ffffff 0%, var(--pale) 100%);
  box-shadow: 0 5px 0 var(--purple);
  transform: translateY(-2px);
}

.type-card .emoji{
  font-size: 24px;
  display: block;
  margin-bottom: 8px;
  transition: transform .25s ease;
}

.type-card:hover .emoji{
  transform: scale(1.2) rotate(-8deg);
}

.type-card .type-name{
  font-size: 12px;
  font-weight: 800;
}

.type-card .type-tag{
  font-size: 9.5px;
  font-weight: 800;
  color: var(--pink);
  background: var(--pink-pale);
  display: inline-block;
  padding: 2px 7px;
  border-radius: 99px;
  margin-top: 6px;
}

.preview{
  padding: 24px;
  min-height: 300px;
  position: sticky;
  top: 86px;
  background: linear-gradient(180deg, #ffffff 0%, #faf7ff 100%);
}

.preview-top{
  display: flex;
  justify-content: space-between;
  align-items: center;
  margin-bottom: 14px;
}

.preview-empty{
  height: 210px;
  display: grid;
  place-items: center;
  color: var(--muted);
  text-align: center;
  font-size: 13px;
}

.preview-title{
  font-size: 19px;
  font-weight: 700;
  margin: 0 0 5px;
}

.preview-desc{
  color: var(--muted);
  font-size: 12.5px;
  margin-bottom: 18px;
}

.q-card{
  border: 2px solid var(--line);
  background: #fff;
  padding: 15px;
  border-radius: 15px;
  margin-bottom: 11px;
}

.q-title{
  font-weight: 800;
  font-size: 13px;
  line-height: 1.45;
  margin-bottom: 10px;
}

.option{
  padding: 9px 12px;
  border: 1.5px solid var(--line);
  border-radius: 10px;
  margin-top: 6px;
  font-size: 12px;
  font-weight: 600;
  color: var(--ink);
}

.option.correct{
  border-color: var(--mint);
  background: var(--mint-pale);
  color: #097553;
  font-weight: 800;
}

.builder-footer{
  display: flex;
  gap: 10px;
  flex-wrap: wrap;
  margin-top: 16px;
}

.tag{
  font-size: 10px;
  font-weight: 800;
  background: var(--sky-pale);
  border-radius: 99px;
  padding: 5px 10px;
  color: #0369a1;
  letter-spacing: 0.5px;
}

.items{
  display: flex;
  flex-direction: column;
  gap: 12px;
}

.item-editor{
  border: 2px solid var(--line);
  border-radius: 15px;
  padding: 14px;
  background: #fcfbff;
}

.item-top{
  display: flex;
  justify-content: space-between;
  align-items: center;
  margin-bottom: 10px;
  font-size: 12px;
  font-weight: 800;
  color: var(--purple);
}

.fields{
  display: grid;
  grid-template-columns: 1fr 1fr;
  gap: 9px;
  margin-top: 8px;
}

/* =========================
   LOGIN SCREEN
========================= */

.login-page{
  min-height: 100vh;
  display: grid;
  place-items: center;
  padding: 25px;
}

.login-card{
  width: min(500px, 100%);
  padding: 36px;
  background: rgba(255, 255, 255, 0.96);
  border: 2px solid var(--line);
  border-radius: 28px;
  box-shadow: 0 24px 60px rgba(115, 75, 249, 0.14);
  animation: popBounce .55s cubic-bezier(.34, 1.56, .64, 1);
  position: relative;
}

.login-gif-header{
  display: flex;
  align-items: center;
  justify-content: space-between;
  margin-bottom: 16px;
}

.login-gif{
  width: 72px;
  height: 72px;
  border-radius: 20px;
  object-fit: cover;
  border: 3px solid var(--pale);
  box-shadow: 0 8px 20px rgba(255, 92, 147, 0.2);
  animation: floatSlow 3.5s ease-in-out infinite;
}

.login-card h1{
  font-size: 27px;
  margin-bottom: 8px;
}

.login-card p{
  font-size: 13px;
  color: var(--muted);
  line-height: 1.6;
}

.role-choice{
  display: grid;
  grid-template-columns: 1fr 1fr;
  gap: 12px;
  margin: 20px 0;
}

.role-btn{
  border: 2px solid var(--line);
  background: #fff;
  border-radius: 18px;
  padding: 16px;
  text-align: left;
  box-shadow: 0 4px 0 var(--line);
  transition: all .22s cubic-bezier(.34, 1.56, .64, 1);
}

.role-btn:hover{
  border-color: var(--purple);
  transform: translateY(-4px);
  box-shadow: 0 8px 0 #d5c8fa;
}

.role-btn.selected{
  border-color: var(--purple);
  background: linear-gradient(180deg, #fff 0%, var(--pale) 100%);
  box-shadow: 0 5px 0 var(--purple);
}

.role-icon{
  font-size: 26px;
  margin-bottom: 8px;
}

.role-title{
  font-weight: 800;
  font-size: 14px;
  font-family: 'Fredoka', sans-serif;
}

.role-description{
  font-size: 11.5px;
  color: var(--muted);
  margin-top: 4px;
}

/* =========================
   STUDENT & PLAY CARDS
========================= */

.student-grid{
  display: grid;
  grid-template-columns: repeat(2, 1fr);
  gap: 18px;
  margin-bottom: 20px;
}

.activity-card{
  padding: 20px;
  margin-bottom: 14px;
}

.activity-card h3{
  font-size: 17px;
  margin: 12px 0 6px;
}

.activity-card p{
  color: var(--muted);
  font-size: 12.5px;
  line-height: 1.5;
  margin-bottom: 14px;
}

.activity-card-footer{
  display: flex;
  justify-content: space-between;
  align-items: center;
  margin-top: 15px;
}

.score-pill{
  font-size: 11px;
  font-weight: 800;
  color: var(--purple);
  background: var(--pale);
  padding: 6px 11px;
  border-radius: 99px;
}

.tracking-row{
  padding: 16px 0;
  border-bottom: 1.5px dashed var(--line);
}

.tracking-row:last-child{
  border-bottom: 0;
}

.tracking-top{
  display: flex;
  justify-content: space-between;
  gap: 12px;
  margin-bottom: 8px;
}

.student-name{
  font-weight: 800;
  font-size: 13.5px;
}

.student-status{
  font-size: 11.5px;
  color: var(--muted);
}

/* =========================
   SHARE / QUIZ PLAY MODE
========================= */

.share-wrap{
  max-width: 680px;
  margin: 38px auto;
  padding: 0 18px;
}

.share-brand{
  font-family: 'Fredoka', sans-serif;
  font-size: 22px;
  font-weight: 700;
  margin-bottom: 20px;
  display: flex;
  align-items: center;
  gap: 10px;
}

.share-card{
  background: #fff;
  border: 2px solid var(--line);
  border-radius: 26px;
  padding: 30px;
  box-shadow: var(--shadow);
  animation: popBounce .45s cubic-bezier(.34, 1.56, .64, 1);
}

.share-card h1{
  font-size: 26px;
  margin-bottom: 8px;
}

.share-card > p{
  font-size: 13px;
  color: var(--muted);
  margin-bottom: 22px;
}

.play-q{
  font-size: 18px;
  font-weight: 700;
  font-family: 'Fredoka', sans-serif;
  line-height: 1.5;
  margin-bottom: 16px;
}

.play-option{
  padding: 14px 16px;
  border: 2px solid var(--line);
  border-radius: 15px;
  margin: 10px 0;
  cursor: pointer;
  font-size: 14px;
  font-weight: 600;
  background: #fff;
  box-shadow: 0 4px 0 var(--line);
  transition: all .2s cubic-bezier(.34, 1.56, .64, 1);
}

.play-option:hover{
  border-color: var(--purple);
  background: var(--pale);
  transform: translateY(-2px) translateX(4px);
  box-shadow: 0 6px 0 #d5c8fa;
}

.play-option.reveal-correct{
  border-color: var(--mint);
  background: var(--mint-pale);
  color: #086648;
  box-shadow: 0 4px 0 var(--mint);
  animation: popBounce .35s ease;
}

.play-option.reveal-wrong{
  border-color: var(--coral);
  background: #fff0f0;
  color: #b82e2e;
  box-shadow: 0 4px 0 var(--coral);
  animation: wiggle .35s ease;
}

.play-explanation{
  background: var(--sun-pale);
  border: 1.5px solid #ffe066;
  border-radius: 14px;
  padding: 13px 15px;
  margin-top: 14px;
  color: #6b4c00;
  font-size: 13px;
  font-weight: 600;
  animation: popBounce .3s ease;
}

.score{
  font-size: 46px;
  font-weight: 700;
  background: linear-gradient(135deg, var(--purple), var(--pink));
  -webkit-background-clip: text;
  -webkit-text-fill-color: transparent;
  margin: 12px 0;
}

.celebration-gif{
  width: 140px;
  height: 140px;
  border-radius: 22px;
  object-fit: cover;
  margin: 10px 0 14px;
  border: 4px solid var(--pale);
  box-shadow: 0 12px 28px rgba(115, 75, 249, 0.2);
  animation: popBounce .5s ease;
}

.mobile-note{
  font-size: 11px;
  color: var(--muted);
  margin-top: 18px;
  text-align: center;
}

/* =========================
   INTERACTIVE MATCHING & ORDERING
========================= */
.match-grid{
  display: grid;
  grid-template-columns: 1fr 1fr;
  gap: 12px;
  margin: 14px 0;
}

.match-btn{
  padding: 14px;
  border: 2px solid var(--line);
  border-radius: 14px;
  background: #fff;
  font-weight: 700;
  font-size: 13px;
  text-align: center;
  box-shadow: 0 4px 0 var(--line);
  transition: all .2s ease;
}

.match-btn:hover{
  border-color: var(--purple);
  transform: translateY(-2px);
}

.match-btn.active{
  border-color: var(--purple);
  background: var(--pale);
  color: var(--purple);
  box-shadow: 0 4px 0 var(--purple);
}

.match-btn.done{
  border-color: var(--mint);
  background: var(--mint-pale);
  color: #086648;
  opacity: 0.75;
  pointer-events: none;
}

.order-item{
  display: flex;
  align-items: center;
  justify-content: space-between;
  gap: 10px;
  padding: 12px 15px;
  border: 2px solid var(--line);
  border-radius: 14px;
  background: #fff;
  margin-bottom: 9px;
  font-weight: 700;
  font-size: 13px;
}

.order-item.correct{
  border-color: var(--mint);
  background: var(--mint-pale);
}

.order-item.wrong{
  border-color: var(--coral);
  background: #fff0f0;
}

/* =========================
   TOAST & STICKER
========================= */

.toast{
  position: fixed;
  bottom: 24px;
  left: 50%;
  transform: translateX(-50%);
  background: linear-gradient(135deg, var(--ink), #322f66);
  color: #fff;
  padding: 12px 20px;
  border-radius: 99px;
  box-shadow: 0 12px 30px rgba(27, 26, 56, 0.28);
  font-size: 13px;
  font-weight: 700;
  z-index: 9999;
  animation: popBounce .35s cubic-bezier(.34, 1.56, .64, 1);
  border: 2px solid rgba(255,255,255,0.15);
}

.learning-sticker{
  position: fixed;
  right: 22px;
  bottom: 20px;
  z-index: 999;
  animation: popBounce .7s cubic-bezier(.34, 1.56, .64, 1) both, floatSlow 4s ease-in-out 1s infinite;
}

.learning-gif{
  width: 116px;
  height: 116px;
  object-fit: cover;
  border-radius: 24px;
  box-shadow: 0 14px 35px rgba(115, 75, 249, 0.25);
  border: 3px solid #fff;
  background: var(--pale);
  cursor: pointer;
  transition: transform .25s ease;
}

.learning-gif:hover{
  transform: scale(1.08) rotate(-4deg);
}

.learning-sticker-close{
  position: absolute;
  top: -8px;
  left: -8px;
  width: 26px;
  height: 26px;
  border: 2px solid #fff;
  border-radius: 50%;
  background: var(--pink);
  color: #fff;
  font-size: 16px;
  font-weight: 800;
  line-height: 20px;
  padding: 0;
  box-shadow: 0 4px 10px rgba(0,0,0,0.15);
  transition: transform .2s ease;
}

.learning-sticker-close:hover{
  transform: scale(1.15) rotate(90deg);
}

.confetti-piece{
  position: fixed;
  top: -20px;
  width: 10px;
  height: 10px;
  border-radius: 3px;
  z-index: 99999;
  pointer-events: none;
  animation: confettiDrop linear forwards;
}

/* =========================
   RESPONSIVE
========================= */

@media(max-width:850px){
  .sidebar{ width: 74px; padding: 20px 10px; }
  .brand{ font-size: 0; padding: 4px 8px 27px; justify-content: center; }
  .brand:first-letter{ font-size: 24px; }
  .brand-sparkle{ font-size: 18px; }
  .side-label, .nav .navtext, .user-info{ display: none; }
  .nav{ justify-content: center; padding: 11px 0; }
  .side-bottom{ justify-content: center; padding: 14px 0 0; }
  .top{ padding: 0 20px; }
  .page{ padding: 24px 18px; }
  .preview{ position: static; }
}

@media(max-width:650px){
  .heading{ flex-direction: column; align-items: flex-start; }
  .heading-left{ flex-direction: column; align-items: flex-start; }
  .stats, .grid2, .student-grid, .role-choice, .match-grid{ grid-template-columns: 1fr; }
  .types{ grid-template-columns: repeat(2, 1fr); }
  .learning-sticker{ right: 12px; bottom: 12px; }
  .learning-gif{ width: 88px; height: 88px; }
}
</style>
</head>

        { left: 'Precipitation', right: 'Water falls from clouds as rain or snow.' }
      ]
    },
    order: {
      title: 'Put the water cycle in order',
      description: 'Arrange these stages from start to finish.',
      items: [
        { text: 'Water gathers in oceans, lakes and rivers.' },
        { text: 'The Sun heats water, which evaporates.' },
        { text: 'Water vapour cools and condenses into clouds.' },
        { text: 'Water falls back to Earth as precipitation.' }
      ]
    }
  };

  /* ==========================================================
     STATE
  ========================================================== */
  let activities = load(KEY, []);
  let users = load(USERS, []);
  let progress = load(PROGRESS, {});
  let saved = load(SAVED, {});
  let teacher = 'Teacher';
  let student = 'Student';
  let session = load(SESSION, null);
  let view = 'dashboard';
  let selectedType = 'multiple';
  let draft = load(DRAFT, JSON.parse(JSON.stringify(examples.multiple)));

  // Seed one default sample activity if storage is empty so student mode has something ready to play
  if (!activities.length) {
    activities = [{
      id: 'sample-water-cycle',
      type: 'multiple',
      title: examples.multiple.title,
      description: examples.multiple.description,
      items: JSON.parse(JSON.stringify(examples.multiple.items)),
      teacherCreated: true,
      createdBy: 'Ms Patel',
      updated: new Date().toISOString()
    }];
    saveStore(KEY, activities);
  }

  let shareState = {
    activity: null,
    isStudent: false,
    index: 0,
    score: 0,
    selected: null,
    done: false,
    flipped: false,
    matchLeft: null,
    matchRightList: [],
    matchedIndices: [],
    orderList: [],
    orderChecked: false
  };

  /* ==========================================================
     HELPERS
  ========================================================== */
  function load(key, fallback) {
    try {
      const raw = localStorage.getItem(key);
      return raw ? JSON.parse(raw) : fallback;
    } catch {
      return fallback;
    }
  }

  function saveStore(key, value) {
    try {
      localStorage.setItem(key, JSON.stringify(value));
    } catch {}
  }

  function esc(s) {
    return String(s ?? '').replace(/[&<>"']/g, c => ({
      '&': '&amp;',
      '<': '&lt;',
      '>': '&gt;',
      '"': '&quot;',
      "'": '&#39;'
    }[c]));
  }

  function toast(message) {
    const r = document.getElementById('toast-root');
    if (!r) return;
    r.innerHTML = `<div class="toast">✨ ${esc(message)}</div>`;
    setTimeout(() => { r.innerHTML = ''; }, 2600);
  }

  function button(text, fn, cls = 'btn') {
    return `<button type="button" class="${cls}" data-act="${esc(fn)}">${text}</button>`;
  }

  function currentUser() {
    return session?.role === 'teacher' ? teacher : student;
  }

  function activityIcon(id) {
    return types.find(t => t.id === id)?.icon || '✨';
  }

  function persistAll() {
    saveStore(KEY, activities);
    saveStore(PROGRESS, progress);
    saveStore(SAVED, saved);
    saveStore(USERS, users);
  }

  function progressKey(userId, activityId) {
    return `${userId}_${activityId}`;
  }

  function getProgress(userId, activityId) {
    return progress[progressKey(userId, activityId)] || {
      started: false,
      completed: false,
      score: 0,
      total: 0,
      percent: 0
    };
  }

    layout(`

                    ${p.completed ? '🎉 Completed' : '⏳ In progress'}

                </div>

                  <div class="tracking-fill" style="width:${p.percent || 0}%"></div>

                  <span>${p.percent || 0}%</span>

          }).join('') : `<div class="empty">No student submissions yet.</div>`}

  function teacherProgressPreview() {
    return Object.entries(progress).slice(0, 4).map(([, p]) => `
      <div style="margin-bottom:16px">
        <div class="tracking-top">
          <div>
            <div class="student-name">🌟 ${esc(p.studentName || 'Student')}</div>
            <div class="student-status">${esc(activities.find(a => a.id === p.activityId)?.title || 'Activity')}</div>
          </div>
          <span class="progress-percent">${p.percent || 0}%</span>
        </div>
        <div class="tracking-bar">
          <div class="tracking-fill" style="width:${p.percent || 0}%"></div>
        </div>
      </div>
    `).join('');
  }

  function teacherCompletionRate() {
    const vals = Object.values(progress);
    if (!vals.length) return 0;
    return Math.round(vals.filter(x => x.completed).length / vals.length * 100);
  }

  function averageProgress() {
    const vals = Object.values(progress);
    if (!vals.length) return 0;
    return Math.round(vals.reduce((sum, x) => sum + (x.percent || 0), 0) / vals.length);
  }

  /* ==========================================================
     BUILDER
  ========================================================== */

            <div class="eyebrow">${isStudent ? 'Personal activity studio' : 'Activity studio'}</div>

            ${button('💾 Save activity', 'save', 'btn primary')}

  function itemsEditor() {
    const items = draft.items || [];
    return items.map((item, i) => `
      <div class="item-editor" data-item="${i}">
        <div class="item-top">
          <span>Item #${i + 1}</span>
          <span>
            ${button('↑', 'up:' + i, 'btn small ghost')}
            ${button('↓', 'down:' + i, 'btn small ghost')}
            ${button('🗑', 'delete:' + i, 'btn small ghost')}
          </span>
        </div>

        ${selectedType === 'multiple' ? `
          <input class="input edit-field" data-key="question" value="${esc(item.question)}" placeholder="Question">
          <div class="fields">
            ${(item.options || []).map((o, j) => `
              <input class="input edit-option" data-index="${j}" value="${esc(o)}" placeholder="Option ${j + 1}">
            `).join('')}
          </div>
          <label class="label">Correct answer</label>
          <select class="correct-select edit-answer">
            ${(item.options || []).map((o, j) => `
              <option value="${j}" ${item.answer === j ? 'selected' : ''}>${String.fromCharCode(65 + j)} · ${esc(o)}</option>
            `).join('')}
          </select>
          <input class="input edit-field" style="margin-top:8px" data-key="explanation" value="${esc(item.explanation)}" placeholder="Short explanation">
        ` : selectedType === 'truefalse' ? `
          <input class="input edit-field" data-key="statement" value="${esc(item.statement)}" placeholder="Statement">
          <select class="correct-select edit-field" style="margin-top:8px" data-key="answer">
            <option value="true" ${item.answer ? 'selected' : ''}>True</option>
            <option value="false" ${!item.answer ? 'selected' : ''}>False</option>
          </select>
          <input class="input edit-field" style="margin-top:8px" data-key="explanation" value="${esc(item.explanation)}" placeholder="Short explanation">
        ` : selectedType === 'flashcards' ? `
          <input class="input edit-field" data-key="front" value="${esc(item.front)}" placeholder="Front of card">
          <textarea class="textarea edit-field" style="margin-top:8px" data-key="back" placeholder="Back of card">${esc(item.back)}</textarea>
        ` : selectedType === 'matching' ? `
          <div class="fields">
            <input class="input edit-field" data-key="left" value="${esc(item.left)}" placeholder="Term">
            <input class="input edit-field" data-key="right" value="${esc(item.right)}" placeholder="Matching meaning">
          </div>
        ` : `
          <input class="input edit-field" data-key="text" value="${esc(item.text)}" placeholder="Item in correct order">
        `}
      </div>
    `).join('');
  }

  function previewMarkup() {
    if (!draft.items?.length) {
      return `<div class="preview-empty">Your interactive preview will appear here! ✨</div>`;
    }

    const top = `
      <h3 class="preview-title">${esc(draft.title)}</h3>
      <p class="preview-desc">${esc(draft.description)}</p>
    `;

    if (selectedType === 'multiple') {
      return top + draft.items.map((it, i) => `
        <div class="q-card">
          <div class="q-title">${i + 1}. ${esc(it.question)}</div>
          ${(it.options || []).map((o, j) => `
            <div class="option ${it.answer === j ? 'correct' : ''}">
              ${String.fromCharCode(65 + j)} &nbsp; ${esc(o)} ${it.answer === j ? '✓' : ''}
            </div>
          `).join('')}
        </div>
      `).join('');
    }

    if (selectedType === 'truefalse') {
      return top + draft.items.map((it, i) => `
        <div class="q-card">
          <div class="q-title">${i + 1}. ${esc(it.statement)}</div>
          <div class="option ${it.answer ? 'correct' : ''}">True ${it.answer ? '✓' : ''}</div>
          <div class="option ${!it.answer ? 'correct' : ''}">False ${!it.answer ? '✓' : ''}</div>
        </div>
      `).join('');
    }

    if (selectedType === 'flashcards') {
      return top + draft.items.map((it, i) => `
        <div class="q-card">
          <div class="tag">CARD ${i + 1}</div>
          <div class="q-title" style="margin-top:8px">${esc(it.front)}</div>
          <div class="option">↻ ${esc(it.back)}</div>
        </div>
      `).join('');
    }

    if (selectedType === 'matching') {
      return top + draft.items.map(it => `
        <div class="q-card">
          <div class="option">${esc(it.left)} &nbsp; ↔ &nbsp; ${esc(it.right)}</div>
        </div>
      `).join('');
    }

    return top + `<div class="hint">Items are shuffled for students.</div>` + draft.items.map((it, i) => `
      <div class="option">${i + 1}. ${esc(it.text)}</div>
    `).join('');
  }

  /* ==========================================================
     DRAFT LOGIC
  ========================================================== */
  function persistDraft() { saveStore(DRAFT, draft); }

  function refreshBuilder() {
    const el = document.getElementById('items');
    if (el) el.innerHTML = itemsEditor();
    const p = document.getElementById('preview');
    if (p) p.innerHTML = previewMarkup();
  }

  function readDraft() {
    const title = document.getElementById('title');
    if (title) draft.title = title.value;
    const description = document.getElementById('description');
    if (description) draft.description = description.value;

    draft.items.forEach((item, i) => {
      const wrap = document.querySelector(`[data-item="${i}"]`);
      if (!wrap) return;

      wrap.querySelectorAll('.edit-field').forEach(el => {
        const key = el.dataset.key;
        if (key === 'answer' && selectedType === 'truefalse') {
          item[key] = el.value === 'true';
        } else if (key) {
          item[key] = el.value;
        }
      });

      wrap.querySelectorAll('.edit-option').forEach(el => {
        if (Array.isArray(item.options)) {
          item.options[+el.dataset.index] = el.value;
        }
      });

      const answer = wrap.querySelector('.edit-answer');
      if (answer) item.answer = +answer.value;
    });

    persistDraft();
  }

  function changeType(id) {
    selectedType = id;
    draft = JSON.parse(JSON.stringify(examples[id] || { title: '', description: '', items: [] }));
    persistDraft();
    builder(session?.role === 'student');
  }

  function addItem() {
    readDraft();
    if (selectedType === 'multiple') {
      draft.items.push({ question: 'New question', options: ['Option A', 'Option B', 'Option C', 'Option D'], answer: 0, explanation: '' });
    } else if (selectedType === 'truefalse') {
      draft.items.push({ statement: 'New statement', answer: true, explanation: '' });
    } else if (selectedType === 'flashcards') {
      draft.items.push({ front: 'New term', back: 'Add an explanation' });
    } else if (selectedType === 'matching') {
      draft.items.push({ left: 'New term', right: 'Its match' });
    } else {
      draft.items.push({ text: 'New item' });
    }
    persistDraft();
    refreshBuilder();
  }

  function retry() {
    readDraft();
    let errors = [];
    if (!draft.title.trim()) errors.push('Add an activity title first!');
    if (!draft.items.length) errors.push('Add at least one item!');
    if (selectedType === 'multiple') {
      draft.items.forEach((x, i) => {
        if (!Array.isArray(x.options) || x.options.length !== 4 || x.options.some(y => !y.trim())) {
          errors.push(`Question ${i + 1} needs four filled options.`);
        }
      });
    }
    if (errors.length) { toast(errors[0]); return false; }
    toast('Looks awesome — activity is ready!');
    return true;
  }

  function generate() {
    const prompt = document.getElementById('prompt')?.value.trim();
    if (prompt) {
      const topic = prompt.replace(/\s+/g, ' ').slice(0, 80);
      draft = JSON.parse(JSON.stringify(examples[selectedType]));
      draft.title = `${topic}${topic.endsWith('?') ? '' : ' — practice'}`;
      draft.description = 'Generated from your notes in creative studio.';
      draft.items = draft.items.map((x, i) => {
        if (selectedType === 'multiple') {
          x.question = `Which statement best relates to ${topic}?`;
          x.options = [`A key idea about ${topic}`, `An unrelated example`, `The opposite of the concept`, `None of these`];
          x.answer = 0;
          x.explanation = `Review your notes: ${topic}`;
        } else if (selectedType === 'truefalse') {
          x.statement = `${topic} is an important concept to review.`;
          x.answer = true;
          x.explanation = `Review this statement against your notes on ${topic}.`;
        } else if (selectedType === 'flashcards') {
          x.front = `Key idea ${i + 1}`;
          x.back = topic;
        } else if (selectedType === 'matching') {
          x.left = `Key term ${i + 1}`;
          x.right = topic;
        } else {
          x.text = `Step ${i + 1}: ${topic}`;
        }
        return x;
      });
    } else {
      draft = JSON.parse(JSON.stringify(examples[selectedType]));
    }
    persistDraft();
    builder(session?.role === 'student');
    retry();
  }

  function save() {
    readDraft();
    if (!retry()) return;

    const id = draft.id || makeId();
    const a = {
      id,
      type: selectedType,
      title: draft.title.trim(),
      description: draft.description.trim(),
      items: draft.items,
      teacherCreated: true,
      createdBy: currentUser(),
      updated: new Date().toISOString()
    };

    const index = activities.findIndex(x => x.id === id);
    if (index >= 0) activities[index] = a;
    else activities.unshift(a);

    persistAll();
    burstConfetti();
    toast(session?.role === 'teacher' ? 'Activity saved for your students!' : 'Personal activity saved!');

    if (session?.role === 'student') studentDashboard();
    else dashboard();
  }

     STUDENT DASHBOARD & PAGES

      <div class="grid2">
        <div class="panel">

          <div style="padding:20px">

                <div class="progress-card" style="margin-bottom:12px">

    layout(`
      <div class="heading">

            <h1>Saved activities</h1>

          </div>

      </div>
      ${list.length ? `<div class="student-grid">${list.map(a => studentActivityCard(a)).join('')}</div>` : `

    return `
      <div class="activity-card">

          <span class="score-pill">${p.percent}% complete</span>
          <div style="display:flex;gap:8px">
            ${button(isSaved ? '⭐ Saved' : '☆ Save', 'toggle-save:' + a.id, 'btn small')}
            ${button(p.completed ? '🔄 Review' : '▶️ Start', 'student-play:' + a.id, 'btn primary small')}

  /* ==========================================================
     EDIT, SHARE, SAVE, PLAY (SUPPORTS ALL 5 ACTIVITY TYPES!)
  ========================================================== */
  function startEdit(id) {
    const a = activities.find(x => x.id === id);
    if (!a) return;
    selectedType = a.type;
    draft = JSON.parse(JSON.stringify(a));
    saveStore(DRAFT, draft);
    builder(false);
  }

  function share(id) {
    const a = activities.find(x => x.id === id);
    if (!a) return;
    const payload = btoa(unescape(encodeURIComponent(JSON.stringify(a))));
    const url = location.href.split('#')[0] + '#a/' + payload;
    if (navigator.clipboard) {
      navigator.clipboard.writeText(url).then(() => toast('Student activity link copied! 🔗')).catch(() => prompt('Copy this link:', url));
    } else {
      prompt('Copy this link:', url);
    }
  }

  function toggleSave(id) {
    if (!saved[student]) saved[student] = [];
    if (saved[student].includes(id)) {
      saved[student] = saved[student].filter(x => x !== id);
      toast('Removed from saved activities.');
    } else {
      saved[student].push(id);
      toast('Activity bookmarked! ⭐');
    }
    saveStore(SAVED, saved);
    if (view === 'saved') savedPage();
    else studentDashboard();
  }

  function shuffleArray(arr) {
    const copy = arr.slice();
    for (let i = copy.length - 1; i > 0; i--) {
      const j = Math.floor(Math.random() * (i + 1));
      [copy[i], copy[j]] = [copy[j], copy[i]];
    }
    return copy;
  }

  function playActivity(a, isStudent = true) {
    const indexedRight = (a.items || []).map((it, idx) => ({ idx, text: it.right }));
    const indexedOrder = (a.items || []).map((it, idx) => ({ idx, text: it.text }));

    shareState = {
      activity: a,
      isStudent,
      index: 0,
      score: 0,
      selected: null,
      done: false,
      flipped: false,
      matchLeft: null,
      matchRightList: shuffleArray(indexedRight),
      matchedIndices: [],
      orderList: shuffleArray(indexedOrder),
      orderChecked: false
    };

    if (isStudent) {
      progress[progressKey(student, a.id)] = {
        studentName: student,
        studentId: student,
        activityId: a.id,
        started: true,
        completed: false,
        score: 0,
        total: a.items.length,
        percent: 0
      };
      saveStore(PROGRESS, progress);
    }

    renderPlay();
  }

  function updateStudentProgress() {
    if (!shareState.isStudent) return;
    const a = shareState.activity;
    const total = Math.max(1, a.items.length);
    const percent = Math.round((shareState.score / total) * 100);
    progress[progressKey(student, a.id)] = {
      studentName: student,
      studentId: student,
      activityId: a.id,
      started: true,
      completed: shareState.done,
      score: shareState.score,
      total: a.items.length,
      percent
    };
    saveStore(PROGRESS, progress);
  }

  function renderPlay() {
    const s = shareState;
    const a = s.activity;
    document.getElementById('toast-root').innerHTML = '';

    let html = `
      <div class="share-wrap">
        <div class="share-brand">
          lesson<b>ly</b> <span class="brand-sparkle">✦</span>
          <span class="tag">${s.isStudent ? 'STUDENT ACTIVITY' : 'PREVIEW MODE'}</span>
        </div>

        <div class="share-card">
          <h1>${esc(a.title)}</h1>
          <p>${esc(a.description)}</p>
    `;

    if (s.done) {
      if (s.score === a.items.length) setTimeout(burstConfetti, 100);
      html += `
        <div style="text-align:center">
          <div class="tag">COMPLETED!</div>
          <br>
          <img class="celebration-gif" src="${s.score === a.items.length ? GIFS.trophy : GIFS.hero}" alt="Celebration">
          <div class="score">${s.score} <span style="font-size:20px;-webkit-text-fill-color:var(--muted)">/ ${a.items.length}</span></div>
          <p style="font-weight:700;color:var(--ink)">
            ${s.score === a.items.length ? 'Perfection! You nailed every single one! 🎉🏆' : 'Awesome effort! Want to give it another go? 💪'}
          </p>
          <div style="display:flex;gap:10px;justify-content:center;flex-wrap:wrap;margin-top:18px">
            ${button('🔄 Play again', (s.isStudent ? 'student-play:' : 'preview-play:') + a.id, 'btn primary')}
            ${session ? button('🏠 Back to dashboard', s.isStudent ? 'student-dashboard' : 'dashboard', 'btn') : ''}
          </div>
        </div>
      `;
    } else if (a.type === 'matching') {
      const doneCount = s.matchedIndices.length;
      html += `
        <div class="tag">MATCHED ${doneCount} OF ${a.items.length}</div>
        <div class="progress-track" style="margin:12px 0 20px">
          <div class="progress-fill" style="width:${(doneCount / a.items.length) * 100}%"></div>
        </div>
        <div class="play-q">Tap a term on the left, then its matching meaning on the right!</div>
        <div class="match-grid">
          <div>
            ${a.items.map((it, idx) => {
              const isDone = s.matchedIndices.includes(idx);
              const isActive = s.matchLeft === idx;
              return `<div class="match-btn ${isDone ? 'done' : ''} ${isActive ? 'active' : ''}" data-act="match-left:${idx}">${esc(it.left)}</div>`;
            }).join('')}
          </div>
          <div>
            ${s.matchRightList.map(item => {
              const isDone = s.matchedIndices.includes(item.idx);
              return `<div class="match-btn ${isDone ? 'done' : ''}" data-act="match-right:${item.idx}">${esc(item.text)}</div>`;
            }).join('')}
          </div>
        </div>
        ${session ? `<div style="margin-top:16px">${button('← Exit', s.isStudent ? 'student-dashboard' : 'dashboard', 'btn small ghost')}</div>` : ''}
      `;
    } else if (a.type === 'order') {
      html += `
        <div class="tag">SEQUENCE CHALLENGE</div>
        <div class="play-q" style="margin-top:12px">Use the arrows to put these steps in the right order:</div>
        <div>
          ${s.orderList.map((item, pos) => {
            let cls = 'order-item';
            if (s.orderChecked) cls += (item.idx === pos ? ' correct' : ' wrong');
            return `
              <div class="${cls}">
                <span><strong>${pos + 1}.</strong> ${esc(item.text)}</span>
                ${!s.orderChecked ? `
                  <span style="display:flex;gap:4px">
                    ${button('↑', 'ord-up:' + pos, 'btn small ghost')}
                    ${button('↓', 'ord-down:' + pos, 'btn small ghost')}
                  </span>
                ` : `<span>${item.idx === pos ? '✅' : '❌'}</span>`}
              </div>
            `;
          }).join('')}
        </div>
        <div style="margin-top:16px;display:flex;gap:10px">
          ${!s.orderChecked
            ? button('✨ Check my order', 'check-order', 'btn primary')
            : button('🏆 See my score', 'finish-order', 'btn primary')}
        </div>
      `;
    } else {
      const i = s.index;
      const it = a.items[i];

      html += `
        <div class="tag">ITEM ${i + 1} OF ${a.items.length}</div>
        <div class="progress-track" style="margin:12px 0 22px">
          <div class="progress-fill" style="width:${(i / a.items.length) * 100}%"></div>
        </div>
      `;

      if (a.type === 'multiple' || a.type === 'truefalse') {
        html += `<div class="play-q">${esc(a.type === 'multiple' ? it.question : it.statement)}</div>`;
        const opts = a.type === 'multiple' ? it.options : ['True', 'False'];

        opts.forEach((o, j) => {
          let c = 'play-option';
          if (s.selected !== null) {
            const correct = a.type === 'multiple' ? j === it.answer : (j === 0) === it.answer;
            if (correct) c += ' reveal-correct';
            else if (j === s.selected) c += ' reveal-wrong';
          }
          html += `<div class="${c}" data-act="choose:${j}">${esc(o)}</div>`;
        });

        if (s.selected !== null) {
          const correct = s.selected === (a.type === 'multiple' ? it.answer : (it.answer ? 0 : 1));
          html += `
            <div class="play-explanation">
              ${correct ? '🎉 Spot on! ' : '💡 Good try! '} ${esc(it.explanation || '')}
            </div>
            <div style="margin-top:16px">
              ${button(i === a.items.length - 1 ? '🏆 See my score' : 'Next question ➡️', 'next', 'btn primary')}
            </div>
          `;
        }
      } else if (a.type === 'flashcards') {
        html += `
          <div class="play-q" style="padding:28px;background:var(--pale);border-radius:18px;text-align:center">
            ${esc(it.front)}
          </div>
          ${s.flipped ? `<div class="play-explanation">✨ ${esc(it.back)}</div>` : ''}
          <div style="margin-top:16px">
            ${button(s.flipped ? (i === a.items.length - 1 ? '🏆 Finish deck' : 'Next card ➡️') : '🔄 Flip card', s.flipped ? 'next-card' : 'flip', 'btn primary')}
          </div>
        `;
      }
    }

    html += `
        </div>
        <div class="mobile-note">Made with Lessonly · Creative Learning Studio ✨</div>
      </div>
    `;

    document.getElementById('app').innerHTML = html;
  }

  /* ==========================================================
     ROUTER & EVENTS
  ========================================================== */
  function route() {
    const hash = location.hash;
    if (hash.startsWith('#a/')) {
      let a;
      try { a = JSON.parse(decodeURIComponent(escape(atob(hash.slice(3))))); } catch {}
      if (!a) {
        document.getElementById('app').innerHTML = `
          <div class="share-wrap"><div class="share-card"><h1>Invalid activity link</h1><p>Ask your teacher for a fresh link.</p></div></div>
        `;
        return;
      }
      playActivity(a, session?.role === 'student');
      return;
    }

    if (!session) { showLogin(); return; }

    if (session.role === 'teacher') {
      teacher = session.name || 'Teacher';
      if (view === 'builder') builder(false);
      else if (view === 'activities') activitiesPage();
      else if (view === 'tracking') trackingPage();
      else dashboard();
    } else {
      student = session.name || 'Student';
      if (view === 'assigned') assignedPage();
      else if (view === 'saved') savedPage();
      else if (view === 'student-builder') builder(true);
      else studentDashboard();
    }
  }

  document.addEventListener('input', e => {
    if (e.target.matches('#title,#description,.edit-field,.edit-option,.edit-answer')) {
      readDraft();
      const p = document.getElementById('preview');
      if (p) p.innerHTML = previewMarkup();
    }
  });

  document.addEventListener('keydown', e => {
    if (e.key === 'Enter' && e.target.id === 'loginname') {
      const loginBtn = document.querySelector('[data-act="login"]');
      if (loginBtn) loginBtn.click();
    }
  });

  document.addEventListener('click', e => {
    const typeCard = e.target.closest('[data-type]');
    if (typeCard) { changeType(typeCard.dataset.type); return; }

    const el = e.target.closest('[data-act]');
    if (!el) return;
    const act = el.dataset.act;

    if (act.startsWith('role:')) {
      const role = act.split(':')[1];
      session = { role, name: role === 'teacher' ? teacher : student };
      showLogin();
      return;
    }

    if (act === 'login') {
      const input = document.getElementById('loginname');
      const name = input ? input.value.trim() : '';
      if (!name) { toast('Enter your name to continue!'); return; }
      if (!session?.role) { toast('Choose Teacher or Student first!'); return; }
      session.name = name;
      if (session.role === 'teacher') teacher = name;
      else student = name;
      saveStore(SESSION, session);
      burstConfetti();
      route();
      return;
    }

    if (act === 'logout') {
      session = null;
      localStorage.removeItem(SESSION);
      location.hash = '';
      showLogin();
      return;
    }

    if (act === 'dashboard') { dashboard(); return; }
    if (act === 'activities') { activitiesPage(); return; }
    if (act === 'builder') {
      selectedType = 'multiple';
      draft = load(DRAFT, JSON.parse(JSON.stringify(examples.multiple)));
      builder(false);
      return;
    }
    if (act === 'tracking') { trackingPage(); return; }
    if (act === 'student-dashboard') { studentDashboard(); return; }
    if (act === 'assigned') { assignedPage(); return; }
    if (act === 'saved') { savedPage(); return; }
    if (act === 'student-builder') {
      selectedType = 'multiple';
      draft = JSON.parse(JSON.stringify(examples.multiple));
      saveStore(DRAFT, draft);
      builder(true);
      return;
    }

    if (act === 'generate') { generate(); return; }
    if (act === 'retry') { readDraft(); retry(); return; }
    if (act === 'save') { save(); return; }
    if (act === 'add-item') { addItem(); return; }
    if (act === 'reset') {
      draft = JSON.parse(JSON.stringify(examples[selectedType]));
      persistDraft();
      builder(session?.role === 'student');
      return;
    }

    if (act.startsWith('share:')) { share(act.slice(6)); return; }
    if (act.startsWith('edit:')) { startEdit(act.slice(5)); return; }
    if (act.startsWith('delete:')) {
      readDraft();
      draft.items.splice(+act.slice(7), 1);
      persistDraft();
      refreshBuilder();
      return;
    }

    if (act.startsWith('up:') || act.startsWith('down:')) {
      readDraft();
      const parts = act.split(':');
      const i = +parts[1];
      const j = parts[0] === 'up' ? i - 1 : i + 1;
      if (j >= 0 && j < draft.items.length) {
        [draft.items[i], draft.items[j]] = [draft.items[j], draft.items[i]];
      }
      persistDraft();
      refreshBuilder();
      return;
    }

    if (act.startsWith('toggle-save:')) { toggleSave(act.slice(12)); return; }
    if (act.startsWith('student-play:')) {
      const a = activities.find(x => x.id === act.slice(13));
      if (a) playActivity(a, true);
      return;
    }
    if (act.startsWith('preview-play:')) {
      const a = activities.find(x => x.id === act.slice(13));
      if (a) playActivity(a, false);
      return;
    }

    if (act.startsWith('choose:')) {
      const s = shareState;
      if (s.selected !== null) return;
      const i = +act.slice(7);
      const it = s.activity.items[s.index];
      const correct = s.activity.type === 'multiple' ? i === it.answer : (i === 0) === it.answer;
      s.selected = i;
      if (correct) {
        s.score++;
        burstConfetti();
      }
      updateStudentProgress();
      renderPlay();
      return;
    }

    if (act === 'flip') {
      shareState.flipped = true;
      renderPlay();
      return;
    }

    if (act === 'next-card') {
      const s = shareState;
      s.score++;
      s.index++;
      s.flipped = false;
      if (s.index >= s.activity.items.length) s.done = true;
      updateStudentProgress();
      renderPlay();
      return;
    }

    if (act === 'next') {
      const s = shareState;
      s.index++;
      s.selected = null;
      s.flipped = false;
      if (s.index >= s.activity.items.length) s.done = true;
      updateStudentProgress();
      renderPlay();
      return;
    }

    /* MATCHING INTERACTIONS */
    if (act.startsWith('match-left:')) {
      shareState.matchLeft = +act.slice(11);
      renderPlay();
      return;
    }

    if (act.startsWith('match-right:')) {
      const s = shareState;
      if (s.matchLeft === null) {
        toast('Pick a term on the left first!');
        return;
      }
      const rightIdx = +act.slice(12);
      if (rightIdx === s.matchLeft) {
        s.matchedIndices.push(rightIdx);
        s.score++;
        s.matchLeft = null;
        burstConfetti();
        if (s.matchedIndices.length >= s.activity.items.length) {
          s.done = true;
        }
        updateStudentProgress();
        renderPlay();
      } else {
        toast('Not a match — try again!');
        s.matchLeft = null;
        renderPlay();
      }
      return;
    }

    /* ORDERING INTERACTIONS */
    if (act.startsWith('ord-up:') || act.startsWith('ord-down:')) {
      const s = shareState;
      const parts = act.split(':');
      const idx = +parts[1];
      const target = parts[0] === 'ord-up' ? idx - 1 : idx + 1;
      if (target >= 0 && target < s.orderList.length) {
        [s.orderList[idx], s.orderList[target]] = [s.orderList[target], s.orderList[idx]];
        renderPlay();
      }
      return;
    }

    if (act === 'check-order') {
      const s = shareState;
      s.orderChecked = true;
      s.score = s.orderList.filter((item, pos) => item.idx === pos).length;
      if (s.score === s.activity.items.length) burstConfetti();
      renderPlay();
      return;
    }

    if (act === 'finish-order') {
      shareState.done = true;
      updateStudentProgress();
      renderPlay();
      return;
    }
  });

  window.addEventListener('hashchange', route);
  route();
})();
</script>

</html>
